version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secagents
      POSTGRES_USER: secagents
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secagents"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: { context: ./api, dockerfile: Dockerfile }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://secagents:${DB_PASSWORD:-changeme}@postgres:5432/secagents
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  rust-core:
    build: { context: ./rust-core, dockerfile: Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis: { condition: service_healthy }

  recon:
    build: { context: ./go-services/recon, dockerfile: Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build: { context: ./frontend/apex, dockerfile: Dockerfile }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
