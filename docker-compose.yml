version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secagents
      POSTGRES_USER: secagents
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secagents"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secagents_redis}"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secagents_redis}", "ping"]
      interval: 5s
      retries: 5

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://secagents:${DB_PASSWORD:?required}@postgres:5432/secagents
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  rust-core:
    build: { context: ., dockerfile: rust-core/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/1
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-example.com}
    depends_on:
      redis: { condition: service_healthy }

  recon:
    build: { context: ., dockerfile: go-services/recon/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/2
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build: { context: ./frontend/apex, dockerfile: Dockerfile }
    ports: ["3000:3000"]
    depends_on: [api]

  worker:
    build: { context: ., dockerfile: api/Dockerfile }
    command: ["python", "-m", "secagents.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://secagents:${DB_PASSWORD:?required}@postgres:5432/secagents
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-example.com}
    depends_on:
      redis: { condition: service_healthy }
    profiles: ["full"]

volumes:
  pgdata:
