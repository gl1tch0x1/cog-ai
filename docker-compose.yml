version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secagents_redis}"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secagents_redis}", "ping"]
      interval: 5s
      retries: 5

  rust-core:
    build: { context: ., dockerfile: rust-core/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/1
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-example.com}
    depends_on:
      redis: { condition: service_healthy }

  recon:
    build: { context: ., dockerfile: go-services/recon/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/2
    depends_on:
      redis: { condition: service_healthy }

