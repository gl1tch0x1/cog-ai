[project]
name = "secagents"
version = "0.2.0"
description = "Autonomous offensive AI framework for authorized security testing"
requires-python = ">=3.11"
dependencies = [
    "openai==1.30.5",
    "httpx==0.28.1",
    "pydantic>=2.7.0",
    "redis==5.0.7",
    "celery==5.4.0",
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
    "loguru>=0.7.2",
    "rich>=13.7.0",
]

[project.scripts]
secagent = "secagents.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "pytest-timeout>=2.3.1", "pytest-cov>=5.0.0", "ruff>=0.4.0", "mypy>=1.10"]
browser = ["playwright>=1.44.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
