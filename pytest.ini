[pytest]
testpaths = tests
pythonpath = python-agents api
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
# We move coverage to the CI/CD pipeline or explicit commands to prevent setup failures
addopts = 
    --verbose
    --tb=short
    --strict-markers
log_cli = true
log_cli_level = INFO
log_level = DEBUG
