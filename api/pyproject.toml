[project]
name = "secagents-api"
version = "0.1.0"
description = "SecAgents FastAPI control-plane"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "pytest-timeout>=2.3.1", "httpx>=0.27.0", "ruff>=0.4.0", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["secagents_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
