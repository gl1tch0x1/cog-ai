name: CI — SecAgents Complete Suite

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  RUST_VERSION: "stable"
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  POSTGRES_DB: secagents
  POSTGRES_USER: secagents
  POSTGRES_PASSWORD: ci_test_password
  DATABASE_URL: postgresql+asyncpg://secagents:ci_test_password@localhost:5432/secagents
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-test-secret-do-not-use-in-production
  OPENAI_API_KEY: sk-test-dummy-key-for-ci
  ALLOWED_DOMAINS: "example.com,*.example.com"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  #  JOB 1: Lint & Format
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: "Lint — ${{ matrix.component }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: "Python (ruff)"
            language: python
          - component: "Rust (rustfmt/clippy)"
            language: rust
          - component: "Go (gofmt/vet)"
            language: go
          - component: "Frontend (lint)"
            language: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ruff
        if: matrix.language == 'python'
        run: pip install ruff

      - name: Run ruff check
        if: matrix.language == 'python'
        run: ruff check python-agents/ api/ --output-format=github

      - name: Run ruff format
        if: matrix.language == 'python'
        run: ruff format python-agents/ api/ --check

      # Rust
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run rustfmt
        if: matrix.language == 'rust'
        run: cd rust-core && cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.language == 'rust'
        run: cd rust-core && cargo clippy --all-targets -- -D warnings

      # Go
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/go.work

      - name: Run gofmt
        if: matrix.language == 'go'
        run: |
          if [[ -n $(gofmt -l go-services) ]]; then
            echo "❌ Go formatting issues found"
            gofmt -d go-services
            exit 1
          fi

      - name: Run go vet
        if: matrix.language == 'go'
        run: cd go-services && go vet ./...

      # Frontend
      - name: Set up Node.js
        if: matrix.language == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-path: frontend/apex/package-lock.json

      - name: Install dependencies
        if: matrix.language == 'frontend'
        run: cd frontend/apex && npm ci

      - name: Run lint
        if: matrix.language == 'frontend'
        run: cd frontend/apex && npm run lint

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 2: Type Checking
  # ─────────────────────────────────────────────────────────────────────
  typecheck:
    name: "Type Check (Python)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e "python-agents/.[dev]"
          pip install -e "api/.[dev]"
          pip install mypy

      - name: Run mypy (python-agents)
        run: mypy python-agents/secagents/ --ignore-missing-imports --no-strict-optional

      - name: Run mypy (api)
        run: mypy api/secagents_api/ --ignore-missing-imports --no-strict-optional

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 3: Python Tests (Agents & API)
  # ─────────────────────────────────────────────────────────────────────
  test-python:
    name: "Tests — Python"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secagents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          pip install -e "python-agents/.[dev,browser]"
          pip install -e "api/.[dev]"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Apply database schema
        run: |
          # Wait for postgres to be ready (even with health checks, sometimes a delay helps)
          until pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}; do
            echo "Waiting for postgres..."
            sleep 1
          done
          
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
            -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} \
            -f api/migrations/001_initial.sql

      - name: Run Agent tests
        run: |
          pytest tests/unit/ \
            -v --tb=short \
            --junit-xml=reports/junit-agents.xml \
            --cov=secagents \
            --cov-report=xml:reports/coverage-agents.xml \
            --asyncio-mode=auto \
            -p no:warnings
        env:
          PYTHONPATH: python-agents

      - name: Run API tests
        run: |
          pytest tests/integration/ \
            -v --tb=short \
            --junit-xml=reports/junit-api.xml \
            --cov=secagents_api \
            --cov-report=xml:reports/coverage-api.xml \
            --asyncio-mode=auto
        env:
          PYTHONPATH: api

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 4: Core Smoke Tests
  # ─────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install python-agents
        run: pip install -e "python-agents/.[dev]"

      - name: Run smoke tests
        run: |
          export PYTHONPATH=python-agents
          python -c "from secagents.engine.caveman import compress; assert compress('test') is not None"
          python -c "from secagents.core.orchestrator import Orchestrator; Orchestrator()"
          python -c "from secagents.modules.cve_checks import CHECKS; assert len(CHECKS) > 0"
          python -c "import secagents; print(f'Version: {secagents.__version__}')"

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 5: Rust & Go Tests
  # ─────────────────────────────────────────────────────────────────────
  test-native:
    name: "Tests — Native (${{ matrix.language }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [rust, go]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-core -> target"

      - name: Run Rust tests
        if: matrix.language == 'rust'
        run: cd rust-core && cargo test --verbose

      # Go
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/go.work

      - name: Run Go tests
        if: matrix.language == 'go'
        run: cd go-services && go test -v ./...

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 6: Frontend Build
  # ─────────────────────────────────────────────────────────────────────
  test-frontend:
    name: "Build — Frontend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-path: frontend/apex/package-lock.json

      - name: Install dependencies
        run: cd frontend/apex && npm ci

      - name: Build
        run: cd frontend/apex && npm run build

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 7: Installer Validation
  # ─────────────────────────────────────────────────────────────────────
  test-installer:
    name: "Validate Installer"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate syntax
        run: python -m py_compile installer.py

      - name: Dry run check
        run: python installer.py --ci --no-db --no-test

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 8: Security Scan
  # ─────────────────────────────────────────────────────────────────────
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 9: Status Summary
  # ─────────────────────────────────────────────────────────────────────
  summary:
    name: "Summary"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-python, smoke-tests, test-native, test-frontend, test-installer, security-scan]
    if: always()
    steps:
      - name: Report CI status
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.test-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Native Tests | ${{ needs.test-native.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer | ${{ needs.test-installer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
