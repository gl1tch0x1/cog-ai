name: CI — SecAgents Test Suite

on:
  push:
    branches: ["main", "develop", "feature/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_DB: secagents
  POSTGRES_USER: secagents
  POSTGRES_PASSWORD: ci_test_password
  DATABASE_URL: postgresql+asyncpg://secagents:ci_test_password@localhost:5432/secagents
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-test-secret-do-not-use-in-production
  OPENAI_API_KEY: sk-test-dummy-key-for-ci
  ALLOWED_DOMAINS: "example.com,*.example.com"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  #  JOB 1: Lint & Type Checks
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Install packages (for type checking)
        run: |
          pip install -e "python-agents/.[dev]"
          pip install -e "api/.[dev]"

      - name: Run ruff (python-agents)
        run: ruff check python-agents/secagents/ --output-format=github
        continue-on-error: false

      - name: Run ruff (api)
        run: ruff check api/secagents_api/ --output-format=github
        continue-on-error: false

      - name: Run mypy (python-agents)
        run: mypy python-agents/secagents/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # warnings, not blocking

      - name: Check installer syntax
        run: python -m py_compile installer.py && echo "installer.py syntax OK"

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 2: Unit Tests (Python Agents)
  # ─────────────────────────────────────────────────────────────────────
  test-python-agents:
    name: "Unit Tests — Python Agents"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secagents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install python-agents (editable + dev extras)
        run: pip install -e "python-agents/.[dev,browser]"

      - name: Apply database schema
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
            -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} \
            -f api/migrations/001_initial.sql
        continue-on-error: true  # OK if tables already exist

      - name: Run unit tests — agents
        run: |
          pytest tests/unit/test_agents.py \
            -v --tb=short \
            --junit-xml=reports/junit-agents.xml \
            --cov=python-agents/secagents \
            --cov-report=xml:reports/coverage-agents.xml \
            --cov-report=term-missing \
            --asyncio-mode=auto \
            -p no:warnings
        env:
          PYTHONPATH: python-agents

      - name: Run unit tests — evaluators
        run: |
          pytest tests/unit/test_evaluators.py \
            -v --tb=short \
            --junit-xml=reports/junit-evaluators.xml \
            --asyncio-mode=auto
        env:
          PYTHONPATH: python-agents

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reports/coverage-agents.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 3: API Integration Tests
  # ─────────────────────────────────────────────────────────────────────
  test-api:
    name: "Integration Tests — FastAPI"
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secagents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install API (editable + dev extras)
        run: pip install -e "api/.[dev]"

      - name: Apply database schema
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
            -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} \
            -f api/migrations/001_initial.sql

      - name: Run API integration tests
        run: |
          pytest tests/integration/test_api.py \
            -v --tb=short \
            --junit-xml=reports/junit-api.xml \
            --asyncio-mode=auto
        env:
          PYTHONPATH: api

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: reports/junit-api.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 4: Core Module Smoke Tests
  # ─────────────────────────────────────────────────────────────────────
  test-core-modules:
    name: "Smoke Tests — Core Modules"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install python-agents
        run: pip install -e "python-agents/.[dev]"

      - name: Test caveman compression
        run: |
          python -c "
          from secagents.engine.caveman import compress, compression_ratio
          original = 'The SQL injection vulnerability has been confirmed in the search parameter'
          compressed = compress(original)
          ratio = compression_ratio(original, compressed)
          assert ratio > 0, 'No compression achieved'
          print(f'Compression ratio: {ratio:.2%}')
          print(f'Original: {original}')
          print(f'Compressed: {compressed}')
          print('caveman.compress OK')
          "
        env:
          PYTHONPATH: python-agents

      - name: Test orchestrator intent classification
        run: |
          python -c "
          from secagents.core.orchestrator import Orchestrator, Intent
          o = Orchestrator()
          assert o.classify_intent('scan example.com for SQLi') == Intent.SCAN
          assert o.classify_intent('recon target.com') == Intent.RECON
          assert o.classify_intent('validate findings') == Intent.VALIDATE
          assert o.classify_intent('generate report') == Intent.REPORT
          print('Orchestrator intent classification OK')
          "
        env:
          PYTHONPATH: python-agents

      - name: Test CVE check definitions
        run: |
          python -c "
          from secagents.modules.cve_checks import CHECKS, get_checks_for_url, is_static_asset
          assert len(CHECKS) == 31, f'Expected 31 checks, got {len(CHECKS)}'
          assert is_static_asset('https://example.com/app.js')
          assert not is_static_asset('https://example.com/api/v1/users')
          dynamic = get_checks_for_url('https://example.com/search?q=test')
          header_only = get_checks_for_url('https://example.com/style.css')
          assert len(dynamic) == 31
          assert len(header_only) < 31
          print(f'CVE checks OK: {len(CHECKS)} checks defined')
          "
        env:
          PYTHONPATH: python-agents

      - name: Test preflight system checks
        run: |
          python -c "
          from secagents.infra.preflight import run_preflight, preflight_ok
          results = run_preflight()
          for r in results:
              print(f'{\"PASS\" if r.passed else \"FAIL\"} [{r.severity}] {r.name}: {r.message}')
          print('Preflight checks completed')
          "
        env:
          PYTHONPATH: python-agents

      - name: Test package imports
        run: |
          python -c "
          import secagents
          from secagents import (
              BaseAgent, PlannerAgent, ReconAgent, WebSecurityAgent,
              APISecurityAgent, ValidatorAgent, ReportAgent, SupervisorAgent,
              Orchestrator,
          )
          from secagents.engine import (
              AutoHealer, MemoryGraph, TelemetryCollector, CINotifier,
              ToolRegistry, PoCGenerator, ConsensusLLM, compress, compression_ratio,
          )
          print(f'secagents v{secagents.__version__} — all imports OK')
          "
        env:
          PYTHONPATH: python-agents

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 5: Installer Validation
  # ─────────────────────────────────────────────────────────────────────
  test-installer:
    name: "Installer — Preflight Check"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: secagents
          POSTGRES_USER: secagents
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secagents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate installer syntax
        run: python -m py_compile installer.py && echo "Syntax OK"

      - name: Run installer preflight check
        run: python installer.py --check
        continue-on-error: true  # Docker not available, so some checks will warn

      - name: Test installer --ci --no-db --no-test
        run: |
          python installer.py --ci --no-db --no-test
          python -c "import os; assert os.path.exists('.env'), '.env not created'"
          echo "Installer CI mode OK"

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 6: Docker Image Build
  # ─────────────────────────────────────────────────────────────────────
  build-docker:
    name: "Build Docker Image — API"
    runs-on: ubuntu-latest
    needs: [test-python-agents, test-api]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: secagents/api:${{ github.sha }},secagents/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/secagents-api.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-api
          path: /tmp/secagents-api.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 7: Security Scan (Trivy)
  # ─────────────────────────────────────────────────────────────────────
  security-scan:
    name: "Security Scan — Trivy"
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-api
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/secagents-api.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secagents/api:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # don't fail, just report

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 8: Status Summary
  # ─────────────────────────────────────────────────────────────────────
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    needs: [lint, test-python-agents, test-api, test-core-modules, test-installer]
    if: always()

    steps:
      - name: Report CI status
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Agents) | ${{ needs.test-python-agents.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests (API) | ${{ needs.test-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core Module Smoke Tests | ${{ needs.test-core-modules.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer Validation | ${{ needs.test-installer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
