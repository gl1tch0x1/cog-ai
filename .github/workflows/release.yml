name: Release — Packaging & Binary Artifacts

on:
  push:
    tags: ["v*"]  # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  #  JOB 1: Build Binaries (PyInstaller)
  # ─────────────────────────────────────────────────────────────────────
  build-binaries:
    name: "Build CLI Binaries"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: secagent-linux
            asset_name: secagent-linux-x64
          - os: windows-latest
            artifact_name: secagent-windows
            asset_name: secagent-windows-x64.exe
          - os: macos-latest
            artifact_name: secagent-macos
            asset_name: secagent-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ./python-agents
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Use a single-file executable build
          pyinstaller --onefile --name ${{ matrix.artifact_name }} python-agents/secagents/__main__.py
          # Rename to asset name
          mv dist/${{ matrix.artifact_name }}* dist/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}

  # ─────────────────────────────────────────────────────────────────────
  #  JOB 2: Create GitHub Release
  # ─────────────────────────────────────────────────────────────────────
  create-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog
        id: changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/secagent-linux/secagent-linux-x64
            artifacts/secagent-windows/secagent-windows-x64.exe
            artifacts/secagent-macos/secagent-macos-x64
