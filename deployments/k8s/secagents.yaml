apiVersion: v1
kind: Namespace
metadata:
  name: secagents
---
# Non-sensitive configuration only. Secrets go in secagents-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secagents-config
  namespace: secagents
data:
  ALLOWED_DOMAINS: "example.com,*.example.com"
  CORS_ORIGINS: "https://secagents.local"
---
# Create this secret before deploying:
#   kubectl create secret generic secagents-secrets -n secagents \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://secagents:YOURPASS@postgres:5432/secagents' \
#     --from-literal=REDIS_URL='redis://:YOURPASS@redis:6379/0' \
#     --from-literal=JWT_SECRET='$(python3 -c "import secrets;print(secrets.token_urlsafe(64))")'
apiVersion: v1
kind: Secret
metadata:
  name: secagents-secrets
  namespace: secagents
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://secagents:CHANGE_ME@postgres:5432/secagents"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
  JWT_SECRET: "GENERATE_WITH_secrets.token_urlsafe(64)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: secagents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: secagents/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: secagents-config
            - secretRef:
                name: secagents-secrets
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: secagents
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-core
  namespace: secagents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-core
  template:
    metadata:
      labels:
        app: rust-core
    spec:
      containers:
        - name: rust-core
          image: secagents/rust-core:latest
          envFrom:
            - configMapRef:
                name: secagents-config
            - secretRef:
                name: secagents-secrets
          resources:
            requests: { cpu: "200m", memory: "128Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recon
  namespace: secagents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recon
  template:
    metadata:
      labels:
        app: recon
    spec:
      containers:
        - name: recon
          image: secagents/recon:latest
          envFrom:
            - configMapRef:
                name: secagents-config
            - secretRef:
                name: secagents-secrets
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: secagents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: secagents/apex:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: secagents
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secagents-ingress
  namespace: secagents
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: secagents.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
